      operationId: listAlerts
      summary: Cảnh báo tồn kho, nặng nhất trước
      description: |
        - `OUT_OF_STOCK` / `LOW_STOCK`: theo sản phẩm × kho, so với `minStock` (sản phẩm đang kinh doanh).
        - `EXPIRED` / `EXPIRING`: theo lô còn tồn; sắp hết hạn = còn ≤ `days` ngày.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/WarehouseFilter'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AlertType' }
        - $ref: '#/components/parameters/ExpiringDays'
      responses:
        '200':
          description: Trang cảnh báo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /alerts/summary:
    get:
      tags: [alerts]
      operationId: getAlertSummary
      summary: Đếm cảnh báo theo loại (huy hiệu trên header)
      parameters:
        - $ref: '#/components/parameters/WarehouseFilter'
        - $ref: '#/components/parameters/ExpiringDays'
      responses:
        '200':
          description: Số cảnh báo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── REPORTS ─────────────────────────────
  /reports/stock-card:
    get:
      tags: [reports]
      operationId: getStockCard
      summary: Thẻ kho của một sản phẩm trong khoảng ngày
      description: |
        Tồn đầu kỳ, từng biến động (nhập/xuất, số dư lũy kế) và tồn cuối kỳ. Không truyền
        `warehouseId` = gộp mọi kho người dùng được xem. Khoảng ngày tối đa 366 ngày.
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/WarehouseFilter'
        - name: lotNumber
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
      responses:
        '200':
          description: Thẻ kho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/inventory-summary:
    get:
      tags: [reports]
      operationId: getInventorySummary
      summary: Báo cáo nhập – xuất – tồn theo sản phẩm trong kỳ
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/WarehouseFilter'
        - name: categoryId
          in: query
          schema: { type: string }
        - name: onlyActive
          in: query
          description: Chỉ dòng có phát sinh hoặc còn tồn (mặc định true)
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
      responses:
        '200':
          description: Trang NXT kèm tổng cộng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/stock-value:
    get:
      tags: [reports]
      operationId: getStockValue
      summary: Giá trị tồn kho hiện tại theo sản phẩm (giá vốn bình quân)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/WarehouseFilter'
        - name: categoryId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Trang giá trị tồn kèm tổng hợp theo nhóm hàng và kho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockValuePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/abc:
    get:
      tags: [reports]
      operationId: getAbcAnalysis
      summary: Phân tích ABC (Pareto) theo giá trị xuất trong kỳ hoặc giá trị tồn
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/WarehouseFilter'
        - name: basis
          in: query
          schema: { $ref: '#/components/schemas/AbcBasis' }
        - name: abcClass
          in: query
          schema: { $ref: '#/components/schemas/AbcClass' }
        - name: thresholdA
          in: query
          description: Ngưỡng tích lũy nhóm A (%)
          schema: { type: integer, minimum: 50, maximum: 95, default: 80 }
        - name: thresholdB
          in: query
          description: Ngưỡng tích lũy nhóm B (%), lớn hơn thresholdA
          schema: { type: integer, minimum: 55, maximum: 99, default: 95 }
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
      responses:
        '200':
          description: Phân tích ABC (dòng theo hạng, tổng hợp nhóm, đường Pareto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: Số bản ghi mỗi trang
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Sort:
      name: sort
      in: query
      description: 'Sắp xếp dạng `field,asc|desc`, ví dụ `name,asc`'
      schema: { type: string, pattern: '^[A-Za-z0-9_.]+,(asc|desc)$' }
    Q:
      name: q
      in: query
      description: Từ khóa tìm kiếm (không phân biệt hoa thường, dấu)
      schema: { type: string }
    DocumentStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/DocumentStatus' }
    WarehouseFilter:
      name: warehouseId
      in: query
      schema: { type: string }
    FromDate:
      name: from
      in: query
      description: Từ ngày (bao gồm), `YYYY-MM-DD`
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      description: Đến ngày (bao gồm), `YYYY-MM-DD`
      schema: { type: string, format: date }
    ReportFromDate:
      name: from
      in: query
      required: true
      description: Từ ngày (bao gồm), `YYYY-MM-DD`
      schema: { type: string, format: date }
    ReportToDate:
      name: to
      in: query
      required: true
      description: Đến ngày (bao gồm), `YYYY-MM-DD`
      schema: { type: string, format: date }
    ExpiringDays:
      name: days
      in: query
      description: Ngưỡng "sắp hết hạn" — số ngày còn lại tối đa
      schema: { type: integer, minimum: 1, maximum: 365, default: 30 }

  responses:
    Unauthorized:
      description: Chưa đăng nhập hoặc access token hết hạn (`UNAUTHORIZED` / `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Không đủ quyền (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Xung đột dữ liệu, ví dụ còn dữ liệu phụ thuộc (`CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidState:
      description: Trạng thái chứng từ không cho phép thao tác (`INVALID_STATE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Dữ liệu không hợp lệ (`VALIDATION_ERROR` / `INSUFFICIENT_STOCK`), lỗi theo field trong `details`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ── Chung ──
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi máy đọc được
          examples: [VALIDATION_ERROR]
        message:
          type: string
          description: Thông điệp cho người dùng
        details:
          type: object
          description: Lỗi theo field. Key là đường dẫn field (vd `lines.0.quantity`).
          additionalProperties:
            type: array
            items: { type: string }

    PageMeta:
      type: object
      required: [total, page, size]
      properties:
        total: { type: integer, minimum: 0, description: Tổng số bản ghi khớp bộ lọc }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }

    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string }
        fullName: { type: string }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    # ── Auth & RBAC ──
    Role:
      type: string
      enum: [ADMIN, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, ACCOUNTANT]
      description: |
        - ADMIN: quản trị người dùng, phân quyền, cấu hình
        - WAREHOUSE_MANAGER: quản lý kho — duyệt phiếu, kiểm kê, báo cáo
        - WAREHOUSE_STAFF: nhân viên kho — nhập, xuất, chuyển kho, quét mã
        - ACCOUNTANT: kế toán / mua hàng — đơn mua, nhà cung cấp, giá vốn

    Permission:
      type: string
      enum:
        - dashboard:view
        - user:read
        - user:write
        - role:read
        - role:write
        - audit:read
        - category:read
        - category:write
        - product:read
        - product:write
        - warehouse:read
        - warehouse:write
        - stock:read
        - goods-receipt:read
        - goods-receipt:write
        - goods-receipt:approve
        - goods-issue:read
        - goods-issue:write
        - goods-issue:approve
        - stock-movement:read
        - transfer:read
        - transfer:write
        - transfer:receive
        - stocktake:read
        - stocktake:write
        - stocktake:count
        - stocktake:approve
        - supplier:read
        - supplier:write
        - customer:read
        - customer:write
        - report:read

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: JWT access token }
        refreshToken: { type: string, description: Refresh token (dùng một lần, được xoay vòng) }
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn: { type: integer, description: Thời hạn access token (giây) }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      type: object
      required: [id, username, fullName, email, role, permissions, warehouseIds]
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        warehouseIds:
          type: array
          description: Kho được phép thao tác (rỗng = mọi kho)
          items: { type: string }
        avatarUrl: { type: string, format: uri }

    # ── Users ──
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]

    User:
      type: object
      required: [id, username, fullName, email, role, status, warehouseIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        warehouseIds:
          type: array
          description: Kho được phép thao tác (rỗng = mọi kho)
          items: { type: string }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }

    UserCreateRequest:
      type: object
      required: [username, password, fullName, email, role]
      properties:
        username: { type: string, pattern: '^[a-z0-9._-]{3,32}$' }
        password: { type: string, minLength: 8 }
        fullName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        warehouseIds:
          type: array
          items: { type: string }

    UserUpdateRequest:
      type: object
      required: [fullName, email, role, status]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        warehouseIds:
          type: array
          items: { type: string }

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 8 }

    # ── Categories ──
    Category:
      type: object
      required: [id, code, name, productCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        parentId: { type: [string, 'null'] }
        parentName: { type: [string, 'null'] }
        description: { type: string }
        productCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CategoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Category' }

    CategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,20}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, 'null'] }
        description: { type: string, maxLength: 500 }

    # ── Products ──
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    Product:
      type: object
      required:
        - id
        - sku
        - name
        - categoryId
        - categoryName
        - unit
        - costPrice
        - salePrice
        - minStock
        - trackLot
        - trackExpiry
        - trackSerial
        - status
        - totalStock
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        sku: { type: string }
        barcode: { type: string }
        name: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        unit: { type: string, description: Đơn vị tính (cái, hộp, thùng, kg…) }
        costPrice:
          type: integer
          minimum: 0
          description: Giá nhập tham chiếu (VND), mặc định khi lập phiếu nhập. Giá vốn bình quân thực tế theo kho nằm ở StockItem.averageCost
        salePrice: { type: integer, minimum: 0, description: Giá bán (VND) }
        minStock: { type: integer, minimum: 0, description: Tồn tối thiểu (mỗi kho) }
        maxStock: { type: integer, minimum: 0 }
        trackLot: { type: boolean, description: Quản lý theo lô }
        trackExpiry: { type: boolean, description: Quản lý hạn sử dụng }
        trackSerial: { type: boolean, description: Quản lý từng đơn vị theo số serial }
        status: { $ref: '#/components/schemas/ProductStatus' }
        description: { type: string }
        imageUrl: { type: string, format: uri }
        totalStock: { type: integer, description: Tổng tồn ở mọi kho }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Product' }

    ProductRequest:
      type: object
      required:
        [sku, name, categoryId, unit, costPrice, salePrice, minStock, trackLot, trackExpiry, status]
      properties:
        sku: { type: string, pattern: '^[A-Z0-9-]{3,32}$' }
        barcode: { type: string, pattern: '^[0-9]{8,14}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        categoryId: { type: string }
        unit: { type: string, minLength: 1, maxLength: 20 }
        costPrice: { type: integer, minimum: 0 }
        salePrice: { type: integer, minimum: 0 }
        minStock: { type: integer, minimum: 0 }
        maxStock: { type: integer, minimum: 0 }
        trackLot: { type: boolean }
        trackExpiry: { type: boolean }
        trackSerial: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/ProductStatus' }
        description: { type: string, maxLength: 2000 }
        imageUrl: { type: string, format: uri }

    # ── Warehouses ──
    WarehouseStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    Warehouse:
      type: object
      required:
        - id
        - code
        - name
        - address
        - status
        - skuCount
        - totalQuantity
        - totalValue
        - binCount
        - usedBinCount
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        managerName: { type: string }
        status: { $ref: '#/components/schemas/WarehouseStatus' }
        skuCount: { type: integer, description: Số SKU đang có tồn > 0 }
        totalQuantity: { type: integer }
        totalValue: { type: integer, description: Giá trị tồn (VND) }
        binCount: { type: integer, description: Số ô lưu trữ đang hoạt động }
        usedBinCount: { type: integer, description: Số ô đang có hàng }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WarehousePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Warehouse' }

    WarehouseRequest:
      type: object
      required: [code, name, address, status]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,20}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone: { type: string }
        managerName: { type: string }
        status: { $ref: '#/components/schemas/WarehouseStatus' }

    # ── Stock ──
    StockStatus:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
      description: 'OUT_OF_STOCK: tồn = 0; LOW_STOCK: 0 < tồn < minStock; IN_STOCK: còn lại'

    StockItem:
      type: object
      required:
        - id
        - productId
        - sku
        - productName
        - unit
        - categoryName
        - warehouseId
        - warehouseCode
        - warehouseName
        - quantity
        - minStock
        - averageCost
        - stockValue
        - status
      properties:
        id: { type: string }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        unit: { type: string }
        categoryName: { type: string }
        warehouseId: { type: string }
        warehouseCode: { type: string }
        warehouseName: { type: string }
        quantity: { type: integer, minimum: 0 }
        minStock: { type: integer, minimum: 0 }
        averageCost: { type: integer, description: Giá vốn bình quân gia quyền tại kho (VND) }
        stockValue: { type: integer, description: quantity × averageCost }
        status: { $ref: '#/components/schemas/StockStatus' }
        lastMovementAt: { type: string, format: date-time }

    StockItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StockItem' }

    # ── Chứng từ ──
    DocumentStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, CANCELLED]
      description: |
        DRAFT → PENDING (gửi duyệt) → APPROVED (ghi sổ tồn) | REJECTED (sửa lại rồi gửi duyệt).
        APPROVED → CANCELLED (hủy bằng bút toán đảo).

    DocumentType:
      type: string
      enum: [GOODS_RECEIPT, GOODS_ISSUE, TRANSFER, STOCKTAKE, ADJUSTMENT]

    DocumentAudit:
      type: object
      required: [createdBy, createdAt, updatedAt]
      properties:
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        approvedBy: { $ref: '#/components/schemas/UserRef' }
        approvedAt: { type: string, format: date-time }
        rejectedBy: { $ref: '#/components/schemas/UserRef' }
        rejectedAt: { type: string, format: date-time }
        rejectedReason: { type: string }
        cancelledBy: { $ref: '#/components/schemas/UserRef' }
        cancelledAt: { type: string, format: date-time }
        cancelReason: { type: string }

    # ── Goods receipts ──
    GoodsReceiptLine:
      type: object
      required: [id, productId, sku, productName, unit, quantity, unitCost, amount]
      properties:
        id: { type: string }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        unit: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitCost: { type: integer, minimum: 0, description: Đơn giá nhập (VND) }
        amount: { type: integer, description: quantity × unitCost }
        trackLot: { type: boolean }
        trackExpiry: { type: boolean }
        trackSerial: { type: boolean }
        lotNumber: { type: string }
        expiryDate: { type: string, format: date }
        serialNumbers:
          type: array
          items: { type: string }
        locationId:
          {
            type: [string, 'null'],
            description: Ô cất hàng (chỉ định,
            hoặc hệ thống chọn khi duyệt),
          }
        locationCode: { type: [string, 'null'] }

    GoodsReceiptLineRequest:
      type: object
      required: [productId, quantity, unitCost]
      description: |
        `lotNumber` bắt buộc khi sản phẩm `trackLot`; `expiryDate` bắt buộc (và sau ngày nhập) khi
        `trackExpiry`; `serialNumbers` bắt buộc, đủ `quantity` số, không trùng khi `trackSerial`.
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitCost: { type: integer, minimum: 0 }
        lotNumber: { type: string, maxLength: 50 }
        expiryDate: { type: string, format: date }
        serialNumbers:
          type: array
          items: { type: string, maxLength: 64 }
        locationId: { type: [string, 'null'], description: Ô cất hàng (null = tự chọn) }

    GoodsReceiptSummary:
      type: object
      required:
        - id
        - code
        - warehouseId
        - warehouseName
        - supplierName
        - receiptDate
        - status
        - lineCount
        - totalQuantity
        - totalAmount
        - createdBy
        - createdAt
      properties:
        id: { type: string }
        code: { type: string, description: 'Mã phiếu, vd PN-202610-0001' }
        warehouseId: { type: string }
        warehouseName: { type: string }
        supplierId: { type: [string, 'null'] }
        supplierName: { type: string }
        referenceNo: { type: string, description: Số đơn mua / hóa đơn tham chiếu }
        receiptDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        lineCount: { type: integer }
        totalQuantity: { type: integer }
        totalAmount: { type: integer }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    GoodsReceipt:
      allOf:
        - $ref: '#/components/schemas/GoodsReceiptSummary'
        - $ref: '#/components/schemas/DocumentAudit'
        - type: object
          required: [lines]
          properties:
            note: { type: string }
            lines:
              type: array
              items: { $ref: '#/components/schemas/GoodsReceiptLine' }

    GoodsReceiptPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/GoodsReceiptSummary' }

    GoodsReceiptRequest:
      type: object
      required: [warehouseId, supplierName, receiptDate, lines]
      properties:
        warehouseId: { type: string }
        supplierId: { type: [string, 'null'] }
        supplierName: { type: string, minLength: 1, maxLength: 200 }
        referenceNo: { type: string, maxLength: 50 }
        receiptDate: { type: string, format: date }
        note: { type: string, maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/GoodsReceiptLineRequest' }

    # ── Goods issues ──
    IssueReason:
      type: string
      enum: [SALE, RETURN_TO_SUPPLIER, INTERNAL_USE, DAMAGED, OTHER]

    GoodsIssueLine:
      type: object
      required: [id, productId, sku, productName, unit, quantity, unitPrice, amount, picks]
      properties:
        id: { type: string }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        unit: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: integer, minimum: 0, description: Đơn giá xuất/bán (VND) }
        amount: { type: integer, description: quantity × unitPrice }
        unitCost: { type: integer, description: Giá vốn tại thời điểm duyệt (chỉ có khi đã duyệt) }
        trackLot: { type: boolean }
        trackExpiry: { type: boolean }
        trackSerial: { type: boolean }
        lotNumber: { type: [string, 'null'], description: Lô chỉ định (null = FEFO) }
        serialNumbers:
          type: array
          description: Serial chỉ định (rỗng = hệ thống chọn)
          items: { type: string }
        picks:
          type: array
          description: Ô / lô / serial đã lấy khi duyệt
          items: { $ref: '#/components/schemas/StockPick' }

    GoodsIssueLineRequest:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: integer, minimum: 0 }
        lotNumber: { type: [string, 'null'], description: Chỉ lấy từ lô này (null = FEFO) }
        serialNumbers:
          type: array
          description: Serial chỉ định — nếu có phải đủ `quantity` số
          items: { type: string, maxLength: 64 }

    GoodsIssueSummary:
      type: object
      required:
        - id
        - code
        - warehouseId
        - warehouseName
        - customerName
        - reason
        - issueDate
        - status
        - lineCount
        - totalQuantity
        - totalAmount
        - createdBy
        - createdAt
      properties:
        id: { type: string }
        code: { type: string, description: 'Mã phiếu, vd PX-202610-0001' }
        warehouseId: { type: string }
        warehouseName: { type: string }
        customerId: { type: [string, 'null'] }
        customerName: { type: string, description: Khách hàng / bộ phận nhận }
        reason: { $ref: '#/components/schemas/IssueReason' }
        referenceNo: { type: string, description: Số đơn bán tham chiếu }
        issueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        lineCount: { type: integer }
        totalQuantity: { type: integer }
        totalAmount: { type: integer }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    GoodsIssue:
      allOf:
        - $ref: '#/components/schemas/GoodsIssueSummary'
        - $ref: '#/components/schemas/DocumentAudit'
        - type: object
          required: [lines]
          properties:
            note: { type: string }
            lines:
              type: array
              items: { $ref: '#/components/schemas/GoodsIssueLine' }

    GoodsIssuePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/GoodsIssueSummary' }

    GoodsIssueRequest:
      type: object
      required: [warehouseId, customerName, reason, issueDate, lines]
      properties:
        warehouseId: { type: string }
        customerId: { type: [string, 'null'] }
        customerName: { type: string, minLength: 1, maxLength: 200 }
        reason: { $ref: '#/components/schemas/IssueReason' }
        referenceNo: { type: string, maxLength: 50 }
        issueDate: { type: string, format: date }
        note: { type: string, maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/GoodsIssueLineRequest' }

    # ── Stock movements ──
    MovementType:
      type: string
      enum:
        [
          RECEIPT,
          RECEIPT_CANCEL,
          ISSUE,
          ISSUE_CANCEL,
          TRANSFER_OUT,
          TRANSFER_IN,
          TRANSFER_CANCEL,
          ADJUSTMENT,
        ]

    StockMovement:
      type: object
      required:
        - id
        - occurredAt
        - type
        - productId
        - sku
        - productName
        - unit
        - warehouseId
        - warehouseName
        - quantity
        - balanceAfter
        - unitCost
        - documentType
        - documentId
        - documentCode
        - createdBy
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/MovementType' }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        unit: { type: string }
        warehouseId: { type: string }
        warehouseName: { type: string }
        locationId: { type: [string, 'null'], description: Ô phát sinh biến động }
        locationCode: { type: [string, 'null'] }
        quantity: { type: integer, description: 'Số lượng có dấu: + nhập, − xuất' }
        balanceAfter: { type: integer, minimum: 0, description: Tồn sau biến động tại kho }
        unitCost: { type: integer }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        documentId: { type: string }
        documentCode: { type: string }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        note: { type: string }
        lotNumber: { type: [string, 'null'] }
        expiryDate: { type: [string, 'null'], format: date }
        serialNumbers:
          type: array
          items: { type: string }

    StockMovementPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StockMovement' }

    # ── Dashboard ──
    DashboardSummary:
      type: object
      required:
        - totalProducts
        - activeProducts
        - totalQuantity
        - totalStockValue
        - lowStockCount
        - outOfStockCount
        - pendingReceipts
        - pendingIssues
        - receiptsThisMonth
        - issuesThisMonth
      properties:
        totalProducts: { type: integer }
        activeProducts: { type: integer }
        totalQuantity: { type: integer }
        totalStockValue: { type: integer }
        lowStockCount: { type: integer, description: Số dòng tồn LOW_STOCK }
        outOfStockCount: { type: integer, description: Số dòng tồn OUT_OF_STOCK }
        pendingReceipts: { type: integer, description: Phiếu nhập chờ duyệt }
        pendingIssues: { type: integer, description: Phiếu xuất chờ duyệt }
        receiptsThisMonth: { type: integer, description: Phiếu nhập đã duyệt trong tháng }
        issuesThisMonth: { type: integer, description: Phiếu xuất đã duyệt trong tháng }

    MovementTrendPoint:
      type: object
      required: [date, inboundQuantity, outboundQuantity, inboundValue, outboundValue]
      properties:
        date: { type: string, format: date }
        inboundQuantity: { type: integer }
        outboundQuantity: { type: integer }
        inboundValue: { type: integer }
        outboundValue: { type: integer }

    # ── Roles ──
    RoleDefinition:
      type: object
      required: [role, permissions, editable, userCount, updatedAt]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        editable: { type: boolean, description: 'false với ADMIN (luôn đủ quyền)' }
        userCount: { type: integer, description: Số người dùng đang giữ vai trò }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UserRef' }

    RolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Permission' }

    # ── Locations ──
    LocationType:
      type: string
      enum: [ZONE, RACK, LEVEL, BIN]
      description: 'Cấp vị trí: ZONE (khu) › RACK (kệ) › LEVEL (tầng) › BIN (ô — nơi chứa hàng)'

    LocationStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    Location:
      type: object
      required:
        [id, warehouseId, type, code, name, path, status, sortOrder, quantity, skuCount, childCount]
      properties:
        id: { type: string }
        warehouseId: { type: string }
        parentId: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/LocationType' }
        code: { type: string, description: 'Mã đầy đủ, duy nhất trong kho, vd A-01-2-03' }
        name: { type: string }
        path:
          { type: string, description: 'Đường dẫn hiển thị, vd "Khu A › Kệ A-01 › Tầng 2 › Ô 03"' }
        capacity: { type: [integer, 'null'], description: Sức chứa (đơn vị hàng) — chỉ với BIN }
        status: { $ref: '#/components/schemas/LocationStatus' }
        sortOrder: { type: integer }
        quantity: { type: integer, description: Tổng tồn trong vị trí (gộp cả vị trí con) }
        skuCount: { type: integer, description: Số SKU đang có tồn trong vị trí }
        childCount: { type: integer }

    LocationRequest:
      type: object
      required: [type, code, name]
      properties:
        parentId: { type: [string, 'null'], description: Bắt buộc với RACK/LEVEL/BIN }
        type: { $ref: '#/components/schemas/LocationType' }
        code: { type: string, pattern: '^[A-Z0-9-]{1,20}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        capacity: { type: integer, minimum: 1 }
        sortOrder: { type: integer }

    LocationUpdateRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        capacity: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/LocationStatus' }
        sortOrder: { type: integer }

    GenerateRackRequest:
      type: object
      required: [zoneId, rackCode, levels, binsPerLevel, binCapacity]
      properties:
        zoneId: { type: string }
        rackCode: { type: string, pattern: '^[A-Z0-9-]{1,12}$', description: 'Mã kệ, vd A-05' }
        rackName: { type: string, maxLength: 100 }
        levels: { type: integer, minimum: 1, maximum: 10 }
        binsPerLevel: { type: integer, minimum: 1, maximum: 20 }
        binCapacity: { type: integer, minimum: 1, maximum: 100000 }

    MapBin:
      type: object
      required: [id, code, status, capacity, quantity, skuCount, fillRate, lowStockSkuCount]
      properties:
        id: { type: string }
        code: { type: string }
        status: { $ref: '#/components/schemas/LocationStatus' }
        capacity: { type: integer }
        quantity: { type: integer }
        skuCount: { type: integer }
        fillRate: { type: number, description: 'quantity / capacity (có thể > 1 khi quá tải)' }
        lowStockSkuCount:
          { type: integer, description: Số SKU trong ô đang dưới tồn tối thiểu của kho }

    MapLevel:
      type: object
      required: [id, code, name, bins]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        bins:
          type: array
          items: { $ref: '#/components/schemas/MapBin' }

    MapRack:
      type: object
      required: [id, code, name, levels, quantity, capacity]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        quantity: { type: integer }
        capacity: { type: integer }
        levels:
          type: array
          description: Tầng cao nhất đứng đầu (đúng chiều nhìn mặt kệ)
          items: { $ref: '#/components/schemas/MapLevel' }

    MapZone:
      type: object
      required: [id, code, name, racks, quantity, capacity]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        quantity: { type: integer }
        capacity: { type: integer }
        racks:
          type: array
          items: { $ref: '#/components/schemas/MapRack' }

    WarehouseMap:
      type: object
      required: [warehouseId, warehouseName, zones, binCount, usedBinCount, capacity, quantity]
      properties:
        warehouseId: { type: string }
        warehouseName: { type: string }
        binCount: { type: integer }
        usedBinCount: { type: integer, description: Số ô đang có hàng }
        capacity: { type: integer }
        quantity: { type: integer }
        zones:
          type: array
          items: { $ref: '#/components/schemas/MapZone' }

    BinStockItem:
      type: object
      required:
        - id
        - warehouseId
        - locationId
        - locationCode
        - locationPath
        - productId
        - sku
        - productName
        - unit
        - quantity
      properties:
        id: { type: string }
        warehouseId: { type: string }
        locationId: { type: string }
        locationCode: { type: string }
        locationPath: { type: string }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        barcode: { type: string }
        unit: { type: string }
        quantity: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }

    BinStockPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BinStockItem' }

    # ── Transfers ──
    TransferStatus:
      type: string
      enum: [DRAFT, IN_TRANSIT, RECEIVED, CANCELLED]
      description: |
        DRAFT → IN_TRANSIT (xuất đi: trừ tồn kho đi) → RECEIVED (nhận: cộng tồn kho đến).
        DRAFT có thể xóa; IN_TRANSIT có thể hủy (hàng hoàn về kho đi).

    TransferPick:
      type: object
      required: [locationId, locationCode, quantity]
      properties:
        locationId: { type: [string, 'null'], description: null = kho chưa khai báo vị trí }
        locationCode: { type: [string, 'null'] }
        quantity: { type: integer }
        lotNumber: { type: [string, 'null'] }
        expiryDate: { type: [string, 'null'], format: date }
        serialNumbers:
          type: array
          items: { type: string }

    TransferLine:
      type: object
      required: [id, productId, sku, productName, unit, quantity, picks]
      properties:
        id: { type: string }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        unit: { type: string }
        quantity: { type: integer, minimum: 1, description: Số lượng chuyển }
        fromLocationId:
          { type: [string, 'null'], description: Ô lấy hàng chỉ định (null = tự phân bổ) }
        picks:
          type: array
          description: Các ô đã lấy hàng khi xuất đi
          items: { $ref: '#/components/schemas/TransferPick' }
        receivedQuantity: { type: [integer, 'null'] }
        toLocationId: { type: [string, 'null'] }
        toLocationCode: { type: [string, 'null'] }

    TransferLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        fromLocationId: { type: [string, 'null'] }

    TransferSummary:
      type: object
      required:
        - id
        - code
        - fromWarehouseId
        - fromWarehouseName
        - toWarehouseId
        - toWarehouseName
        - status
        - transferDate
        - lineCount
        - totalQuantity
        - createdBy
        - createdAt
      properties:
        id: { type: string }
        code: { type: string, description: 'Mã phiếu, vd CK-202610-0001' }
        fromWarehouseId: { type: string }
        fromWarehouseName: { type: string }
        toWarehouseId: { type: string }
        toWarehouseName: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        transferDate: { type: string, format: date }
        expectedDate: { type: [string, 'null'], format: date }
        lineCount: { type: integer }
        totalQuantity: { type: integer }
        receivedQuantity: { type: [integer, 'null'] }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    Transfer:
      allOf:
        - $ref: '#/components/schemas/TransferSummary'
        - type: object
          required: [lines, updatedAt]
          properties:
            note: { type: string }
            lines:
              type: array
              items: { $ref: '#/components/schemas/TransferLine' }
            updatedAt: { type: string, format: date-time }
            shippedBy: { $ref: '#/components/schemas/UserRef' }
            shippedAt: { type: string, format: date-time }
            receivedBy: { $ref: '#/components/schemas/UserRef' }
            receivedAt: { type: string, format: date-time }
            receiveNote: { type: string }
            cancelledBy: { $ref: '#/components/schemas/UserRef' }
            cancelledAt: { type: string, format: date-time }
            cancelReason: { type: string }

    TransferPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TransferSummary' }

    TransferRequest:
      type: object
      required: [fromWarehouseId, toWarehouseId, transferDate, lines]
      properties:
        fromWarehouseId: { type: string }
        toWarehouseId: { type: string }
        transferDate: { type: string, format: date }
        expectedDate: { type: [string, 'null'], format: date }
        note: { type: string, maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TransferLineRequest' }

    TransferReceiveRequest:
      type: object
      required: [lines]
      properties:
        note: { type: string, maxLength: 1000 }
        lines:
          type: array
          items:
            type: object
            required: [lineId, receivedQuantity]
            properties:
              lineId: { type: string }
              receivedQuantity: { type: integer, minimum: 0 }
              toLocationId: { type: [string, 'null'], description: Ô cất hàng (null = tự chọn) }

    # ── Stocktakes ──
    StocktakeStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, COMPLETED, CANCELLED]
      description: 'IN_PROGRESS (đang đếm) → SUBMITTED (chờ duyệt) → COMPLETED (đã điều chỉnh tồn)'

    StocktakeSummary:
      type: object
      required:
        - id
        - code
        - warehouseId
        - warehouseName
        - name
        - status
        - blind
        - scopeLabel
        - lineCount
        - countedLineCount
        - varianceLineCount
        - varianceQuantity
        - varianceValue
        - createdBy
        - createdAt
      properties:
        id: { type: string }
        code: { type: string, description: 'Mã phiên, vd KK-202610-0001' }
        warehouseId: { type: string }
        warehouseName: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/StocktakeStatus' }
        blind: { type: boolean, description: Đếm mù — người đếm không thấy số tồn hệ thống }
        zoneIds:
          type: array
          items: { type: string }
        scopeLabel:
          { type: string, description: 'Phạm vi hiển thị, vd "Toàn kho" hoặc "Khu A, Khu B"' }
        lineCount: { type: integer }
        countedLineCount: { type: integer }
        varianceLineCount: { type: integer, description: Số dòng đã đếm có chênh lệch }
        varianceQuantity: { type: integer, description: Tổng chênh lệch (có dấu) }
        varianceValue: { type: integer, description: Giá trị chênh lệch theo giá vốn (VND, có dấu) }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    Stocktake:
      allOf:
        - $ref: '#/components/schemas/StocktakeSummary'
        - type: object
          required: [updatedAt]
          properties:
            note: { type: string }
            updatedAt: { type: string, format: date-time }
            submittedBy: { $ref: '#/components/schemas/UserRef' }
