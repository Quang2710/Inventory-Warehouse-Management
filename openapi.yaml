openapi: 3.1.0
info:
  title: Inventory & Warehouse Management API
  version: 0.1.0
  description: |
    Contract giữa frontend Angular và backend cho hệ thống quản lý tồn kho & kho hàng (MVP).

    **Quy ước chung**
    - Danh sách luôn phân trang phía server: `?page=1&size=20&sort=field,asc&q=từ khóa`.
      `page` bắt đầu từ **1**. Response: `{ items, total, page, size }`.
    - Lỗi luôn có dạng `ErrorResponse` `{ code, message, details? }`.
      Mã lỗi (`code`) thường gặp: `VALIDATION_ERROR`, `INVALID_CREDENTIALS`, `ACCOUNT_LOCKED`,
      `UNAUTHORIZED`, `TOKEN_EXPIRED`, `INVALID_REFRESH_TOKEN`, `FORBIDDEN`, `NOT_FOUND`,
      `CONFLICT`, `INVALID_STATE`, `INSUFFICIENT_STOCK`, `INTERNAL_ERROR`.
    - Thời gian dạng ISO-8601 (UTC). Ngày chứng từ dạng `YYYY-MM-DD` (theo giờ Asia/Ho_Chi_Minh).
    - Tiền tệ: VND, số nguyên.
    - Phạm vi kho: người dùng có `warehouseIds` khác rỗng chỉ thấy/thao tác dữ liệu của các kho đó
      (vi phạm → `403 FORBIDDEN`).
    - Tồn kho chỉ thay đổi qua chứng từ đã duyệt (sinh `StockMovement`). Không cho phép tồn âm.
      Chứng từ đã duyệt không được sửa/xóa, chỉ hủy (hệ thống sinh bút toán đảo).
    - Lô / hạn sử dụng / serial: sản phẩm `trackLot` / `trackExpiry` được theo dõi tồn theo từng lô
      (sản phẩm × ô × lô); sản phẩm `trackSerial` theo dõi từng đơn vị. Xuất kho, chuyển kho tự
      phân bổ theo **FEFO** (hết hạn trước xuất trước, cùng hạn thì lô nhập trước), không xuất lô đã
      hết hạn (trừ lý do `DAMAGED`).
servers:
  - url: /api
    description: Cùng origin (proxy hoặc mock MSW)
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Xác thực & phiên đăng nhập
  - name: users
    description: Quản lý người dùng (Admin)
  - name: categories
    description: Danh mục sản phẩm
  - name: products
    description: Sản phẩm / SKU
  - name: warehouses
    description: Kho hàng
  - name: stock
    description: Tồn kho hiện tại
  - name: goods-receipts
    description: Phiếu nhập kho
  - name: goods-issues
    description: Phiếu xuất kho
  - name: stock-movements
    description: Thẻ kho / lịch sử biến động tồn
  - name: dashboard
    description: Số liệu tổng quan
  - name: roles
    description: Vai trò & ma trận phân quyền
  - name: transfers
    description: Chuyển kho
  - name: stocktakes
    description: Kiểm kê
  - name: partners
    description: Nhà cung cấp & khách hàng
  - name: audit
    description: Nhật ký thao tác (audit log)
  - name: alerts
    description: Cảnh báo tồn kho (dưới tối thiểu, sắp hết hạn, hết hạn)
  - name: reports
    description: Báo cáo (thẻ kho, nhập-xuất-tồn, giá trị tồn, ABC)

paths:
  # ───────────────────────────── AUTH ─────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập bằng tên đăng nhập & mật khẩu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Sai tên đăng nhập hoặc mật khẩu (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Tài khoản bị khóa (`ACCOUNT_LOCKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Cấp lại access token bằng refresh token (refresh token được xoay vòng)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: Refresh token không hợp lệ/hết hạn/đã thu hồi (`INVALID_REFRESH_TOKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất, thu hồi refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: Đã đăng xuất }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Thông tin người dùng hiện tại kèm quyền
      responses:
        '200':
          description: Người dùng hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── USERS ─────────────────────────────
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Danh sách người dùng
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200':
          description: Trang người dùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: Tạo người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [users]
      operationId: getUser
      summary: Chi tiết người dùng
      responses:
        '200':
          description: Người dùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Cập nhật người dùng (họ tên, email, vai trò, trạng thái)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Xóa người dùng (không cho xóa chính mình)
      responses:
        '204': { description: Đã xóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Đặt lại mật khẩu cho người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Đã đặt lại mật khẩu }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── CATEGORIES ─────────────────────────────
  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Danh sách danh mục
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: parentId
          in: query
          description: Lọc theo danh mục cha. Truyền `root` để lấy danh mục gốc.
          schema: { type: string }
      responses:
        '200':
          description: Trang danh mục
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Tạo danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [categories]
      operationId: getCategory
      summary: Chi tiết danh mục
      responses:
        '200':
          description: Danh mục
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [categories]
      operationId: updateCategory
      summary: Cập nhật danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Xóa danh mục (không cho xóa khi còn sản phẩm hoặc danh mục con)
      responses:
        '204': { description: Đã xóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── PRODUCTS ─────────────────────────────
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Danh sách sản phẩm
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: categoryId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - name: stockStatus
          in: query
          description: Lọc theo tình trạng tồn (tổng mọi kho)
          schema: { $ref: '#/components/schemas/StockStatus' }
      responses:
        '200':
          description: Trang sản phẩm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [products]
      operationId: createProduct
      summary: Tạo sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [products]
      operationId: getProduct
      summary: Chi tiết sản phẩm
      responses:
        '200':
          description: Sản phẩm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [products]
      operationId: updateProduct
      summary: Cập nhật sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Xóa sản phẩm (không cho xóa khi đã phát sinh chứng từ — chỉ ngừng kinh doanh)
      responses:
        '204': { description: Đã xóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/by-barcode/{barcode}:
    get:
      tags: [products]
      operationId: getProductByBarcode
      summary: Tìm sản phẩm theo mã vạch (dùng khi quét mã)
      parameters:
        - name: barcode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sản phẩm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── WAREHOUSES ─────────────────────────────
  /warehouses:
    get:
      tags: [warehouses]
      operationId: listWarehouses
      summary: Danh sách kho
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WarehouseStatus' }
        - name: scope
          in: query
          description: |
            `mine` (mặc định): chỉ kho trong phạm vi của người dùng.
            `all`: mọi kho — chỉ để chọn kho đến khi chuyển kho; thao tác tại kho vẫn kiểm tra phạm vi.
          schema:
            type: string
            enum: [mine, all]
      responses:
        '200':
          description: Trang kho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [warehouses]
      operationId: createWarehouse
      summary: Tạo kho
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [warehouses]
      operationId: getWarehouse
      summary: Chi tiết kho
      responses:
        '200':
          description: Kho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [warehouses]
      operationId: updateWarehouse
      summary: Cập nhật kho
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseRequest' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [warehouses]
      operationId: deleteWarehouse
      summary: Xóa kho (không cho xóa khi còn tồn hoặc đã phát sinh chứng từ)
      responses:
        '204': { description: Đã xóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── STOCK ─────────────────────────────
  /stock:
    get:
      tags: [stock]
      operationId: listStock
      summary: Tồn kho hiện tại theo sản phẩm × kho
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StockStatus' }
      responses:
        '200':
          description: Trang tồn kho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stock/by-product/{productId}:
    get:
      tags: [stock]
      operationId: getStockByProduct
      summary: Tồn của một sản phẩm ở tất cả các kho
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Danh sách tồn theo kho
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── GOODS RECEIPTS ─────────────────────────────
  /goods-receipts:
    get:
      tags: [goods-receipts]
      operationId: listGoodsReceipts
      summary: Danh sách phiếu nhập
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/DocumentStatusFilter'
        - $ref: '#/components/parameters/WarehouseFilter'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Trang phiếu nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceiptPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [goods-receipts]
      operationId: createGoodsReceipt
      summary: Tạo phiếu nhập (trạng thái DRAFT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsReceiptRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /goods-receipts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [goods-receipts]
      operationId: getGoodsReceipt
      summary: Chi tiết phiếu nhập
      responses:
        '200':
          description: Phiếu nhập
          content:
            application/json:
