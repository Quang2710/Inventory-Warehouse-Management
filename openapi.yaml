  /stocktakes/{id}/counts:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [stocktakes]
      operationId: submitStocktakeCounts
      summary: Gửi số đếm (theo lô, idempotent) — dùng cho đồng bộ hàng đợi offline
      description: |
        Mỗi entry ghi đè số đếm của dòng (giá trị tuyệt đối, không cộng dồn).
        Xung đột giữa các thiết bị giải quyết theo `countedAt` mới nhất; entry cũ hơn bị bỏ qua (`STALE`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StocktakeCountBatch' }
      responses:
        '200':
          description: Kết quả áp dụng từng entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StocktakeCountResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stocktakes/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [stocktakes]
      operationId: submitStocktake
      summary: Kết thúc đếm, chuyển sang chờ duyệt (IN_PROGRESS → SUBMITTED)
      responses:
        '200':
          description: Phiên chờ duyệt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stocktake' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /stocktakes/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [stocktakes]
      operationId: reopenStocktake
      summary: Mở lại để đếm bổ sung (SUBMITTED → IN_PROGRESS)
      responses:
        '200':
          description: Phiên đang đếm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stocktake' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /stocktakes/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [stocktakes]
      operationId: approveStocktake
      summary: Duyệt kết quả kiểm kê (SUBMITTED → COMPLETED), sinh bút toán điều chỉnh tồn
      description: Chênh lệch = số đếm − tồn hệ thống hiện tại của ô. Dòng chưa đếm không được điều chỉnh.
      responses:
        '200':
          description: Phiên đã hoàn tất
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stocktake' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /stocktakes/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [stocktakes]
      operationId: cancelStocktake
      summary: Hủy phiên kiểm kê chưa hoàn tất
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
