<a class="skip-link" href="#main-content">{{ 'app.skipToContent' | t }}</a>

<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__nav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="menuOpen()"
    (closedStart)="onMenuClosed()"
  >
    <app-sidebar [sections]="navigation()" (navigate)="onNavigate()" />
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    @if (auth.user(); as user) {
      <app-header
        [user]="user"
        [language]="i18n.language()"
        [languages]="i18n.languages"
        [themeMode]="theme.mode()"
        [demoMode]="demoMode"
        [alertCount]="alertCount()"
        [alertCritical]="alertCritical()"
        [canScan]="canScan()"
        [installable]="pwa.installable()"
        (install)="pwa.install()"
        (menuToggle)="toggleMenu()"
        (languageChange)="changeLanguage($event)"
        (themeModeChange)="changeTheme($event)"
        (logout)="logout()"
        (demoReset)="resetDemo()"
      />
    }

    <main id="main-content" class="page" tabindex="-1">
      <app-breadcrumb [crumbs]="breadcrumbs()" />
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
