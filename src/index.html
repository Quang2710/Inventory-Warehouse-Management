<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Quản lý Kho</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Hệ thống quản lý tồn kho & kho hàng" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b57d0" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quản lý Kho" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <style>
      /* Màn hình chờ khi khởi động (nạp backend giả / khôi phục phiên) — bị thay khi app render. */
      .boot {
        display: grid;
        place-items: center;
        gap: 12px;
        min-height: 100vh;
        align-content: center;
        font:
          500 15px/1.4 Roboto,
          'Segoe UI',
          Arial,
          sans-serif;
        color: #5f6368;
      }
      .boot__bar {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        background:
          linear-gradient(90deg, transparent, #1a73e8, transparent) 0 0 / 50% 100% no-repeat,
          #e0e3e7;
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        from {
          background-position:
            -100% 0,
            0 0;
        }
        to {
          background-position:
            200% 0,
            0 0;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121316;
        }
        .boot {
          color: #c4c7c5;
        }
        .boot__bar {
          background-color: #2f3033;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot" role="status" aria-live="polite">
        <div class="boot__bar"></div>
        <span>Đang khởi động…</span>
      </div>
    </app-root>
  </body>
</html>
